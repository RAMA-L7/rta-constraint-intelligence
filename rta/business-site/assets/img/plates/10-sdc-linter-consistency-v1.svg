<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>SDC findings and fixes</title>
  <desc>The same constraint file before and after rta check, with each finding and each
        resolution marked in place.</desc>
  <style>
    .hd  { font-family:'Space Grotesk','Inter',system-ui,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono{ font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#020409"/><stop offset="0.45" stop-color="#04060B"/><stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <pattern id="grid56" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56,0 H0 V56" fill="none" stroke="#38BDF8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="feather" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="150"/></filter>
    <mask id="gridMask"><rect x="200" y="-40" width="3440" height="2240" fill="#ffffff" filter="url(#feather)"/></mask>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.070"/><stop offset="0.35" stop-color="#7DD3FC" stop-opacity="0.030"/><stop offset="1" stop-color="#0B1220" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.015"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity="0.58"/><stop offset="0.32" stop-color="#38BDF8" stop-opacity="0.26"/><stop offset="0.78" stop-color="#38BDF8" stop-opacity="0.13"/><stop offset="1" stop-color="#BAE6FD" stop-opacity="0.40"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.12"/><stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.04"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.48" r="0.64">
      <stop offset="0.48" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/><feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bgGrad)"/>
  <rect width="3840" height="2160" fill="url(#grid56)" mask="url(#gridMask)"/>
  <ellipse cx="1150" cy="1080" rx="900" ry="820" fill="url(#pool)"/>
  <ellipse cx="2700" cy="1080" rx="900" ry="820" fill="url(#pool)"/>

  <!-- ================= BEFORE ================= -->
  <g>
    <rect x="460" y="540" width="1280" height="1040" rx="16" fill="url(#glass)"/>
    <rect x="460" y="540" width="1280" height="1040" rx="16" fill="none" stroke="#F87171" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="460" y="540" width="1280" height="1040" rx="16" fill="url(#sheen)"/>
    <text class="mono" x="520" y="606" font-size="24" letter-spacing="4" fill="#FCA5A5">BEFORE</text>
    <text class="mono" x="1680" y="606" font-size="19" text-anchor="end" fill="#7C90A8">as written</text>
    <line x1="460" y1="636" x2="1740" y2="636" stroke="#F87171" stroke-opacity="0.20"/>

    <g class="mono" font-size="21">
      <text class="mono" x="520" y="700" font-size="21"><tspan fill="#7DD3FC">create_clock</tspan><tspan fill="#C4B5FD"> -name </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> -period </tspan><tspan fill="#FCD34D">2.000</tspan><tspan fill="#8A99B5"> [get_ports clk]</tspan></text>

      <text class="mono" x="520" y="760" font-size="21"><tspan fill="#7DD3FC">create_clock</tspan><tspan fill="#C4B5FD"> -name </tspan><tspan fill="#E2E8F0">clk_slow</tspan><tspan fill="#C4B5FD"> -period </tspan><tspan fill="#FCD34D">8.000</tspan><tspan fill="#8A99B5"> [get_ports clk_slow]</tspan></text>

      <text class="mono" x="520" y="820" font-size="21"><tspan fill="#7DD3FC">set_input_delay</tspan><tspan fill="#C4B5FD"> -clock </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> </tspan><tspan fill="#FCD34D">0.400</tspan><tspan fill="#8A99B5"> [get_ports {d_in[*]}]</tspan></text>
      <circle cx="504" cy="814" r="7" fill="#FBBF24"/>
      <rect x="1290" y="792" width="330" height="40" rx="20" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text class="mono" x="1310" y="819" font-size="18" fill="#F7E3B0">SDC-028 no -min</text>

      <text class="mono" x="520" y="880" font-size="21"><tspan fill="#7DD3FC">set_output_delay</tspan><tspan fill="#C4B5FD"> -clock </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> </tspan><tspan fill="#FCD34D">0.350</tspan><tspan fill="#8A99B5"> [get_ports {d_out[*]}]</tspan></text>
      <circle cx="504" cy="874" r="7" fill="#FBBF24"/>
      <rect x="1290" y="852" width="330" height="40" rx="20" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text class="mono" x="1310" y="879" font-size="18" fill="#F7E3B0">SDC-029 no -min</text>

      <text class="mono" x="520" y="940" font-size="21"><tspan fill="#7DD3FC">set_input_delay</tspan><tspan fill="#C4B5FD"> -clock </tspan><tspan fill="#E2E8F0">clk_slow</tspan><tspan fill="#C4B5FD"> </tspan><tspan fill="#FCD34D">1.200</tspan><tspan fill="#8A99B5"> [get_ports {cfg_bus[*]}]</tspan></text>

      <text class="mono" x="520" y="1000" font-size="21" opacity="0.45"><tspan fill="#5A7089"># no set_clock_groups, no set_propagated_clock</tspan></text>
      <rect x="1290" y="972" width="330" height="40" rx="20" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text class="mono" x="1310" y="999" font-size="18" fill="#F7E3B0">SDC-024 no clock groups</text>

      <text class="mono" x="520" y="1060" font-size="21"><tspan fill="#7DD3FC">set_case_analysis</tspan><tspan fill="#C4B5FD"> 0 </tspan><tspan fill="#8A99B5">[get_ports mode]</tspan></text>
      <text class="mono" x="520" y="1120" font-size="21"><tspan fill="#7DD3FC">set_case_analysis</tspan><tspan fill="#C4B5FD"> 1 </tspan><tspan fill="#8A99B5">[get_ports mode]</tspan></text>
      <circle cx="504" cy="1114" r="7" fill="#F87171" filter="url(#cyanGlow)"/>
      <rect x="1290" y="1092" width="330" height="40" rx="20" fill="#F87171" fill-opacity="0.12" stroke="#F87171" stroke-opacity="0.4"/>
      <text class="mono" x="1310" y="1119" font-size="18" fill="#FECACA">SDC-049 contradiction</text>

      <text class="mono" x="520" y="1180" font-size="21"><tspan fill="#7DD3FC">set_false_path</tspan><tspan fill="#C4B5FD"> -from </tspan><tspan fill="#8A99B5">[get_clocks clk_slow]</tspan></text>
    </g>

    <line x1="520" y1="1230" x2="1680" y2="1230" stroke="#F87171" stroke-opacity="0.20"/>
    <g class="mono" font-size="20">
      <text class="mono" x="520" y="1290" font-size="20" fill="#5A7089">0 errors, 8 warnings</text>
      <text class="mono" x="520" y="1340" font-size="20" fill="#5A7089">5 of 8 shown, each with a rule code</text>
      <text class="mono" x="520" y="1390" font-size="20" fill="#5A7089">1 blocker, 7 review items</text>
    </g>
    <rect x="520" y="1430" width="1160" height="100" rx="12" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-opacity="0.3"/>
    <text class="mono" x="560" y="1472" font-size="20" fill="#FECACA">a contradiction no tool will flag for you</text>
    <text class="mono" x="560" y="1508" font-size="20" fill="#7C90A8">the later value silently wins</text>
  </g>

  <!-- ================= LINTER ================= -->
  <g>
    <rect x="1850" y="760" width="140" height="600" rx="20" fill="url(#glass)"/>
    <rect x="1850" y="760" width="140" height="600" rx="20" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <g transform="translate(1920 1060)">
      <circle cx="0" cy="0" r="180" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 14"/>
      <circle cx="0" cy="0" r="140" fill="none" stroke="#38BDF8" stroke-opacity="0.30" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#7DD3FC" stroke-opacity="0.40" stroke-width="2.5" stroke-dasharray="6 10"/>
      <circle cx="0" cy="0" r="58" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2.5"/>
      <path d="M-18,0 l12,13 l24,-27" fill="none" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="mono" x="1920" y="1420" font-size="20" text-anchor="middle" fill="#7DD3FC">check</text>
    <line x1="1740" y1="1060" x2="1850" y2="1060" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M1838,1046 L1862,1060 L1838,1074" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1990" y1="1060" x2="2100" y2="1060" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M2088,1046 L2112,1060 L2088,1074" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= AFTER ================= -->
  <g>
    <rect x="2100" y="540" width="1300" height="1040" rx="16" fill="url(#glass)"/>
    <rect x="2100" y="540" width="1300" height="1040" rx="16" fill="none" stroke="#34D399" stroke-opacity="0.32" stroke-width="2"/>
    <rect x="2100" y="540" width="1300" height="1040" rx="16" fill="url(#sheen)"/>
    <text class="mono" x="2160" y="606" font-size="24" letter-spacing="4" fill="#6EE7B7">AFTER</text>
    <text class="mono" x="3340" y="606" font-size="19" text-anchor="end" fill="#7C90A8">after rta check fixes</text>
    <line x1="2100" y1="636" x2="3400" y2="636" stroke="#34D399" stroke-opacity="0.20"/>

    <g class="mono" font-size="21">
      <text class="mono" x="2160" y="700" font-size="21"><tspan fill="#7DD3FC">create_clock</tspan><tspan fill="#C4B5FD"> -name </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> -period </tspan><tspan fill="#FCD34D">2.000</tspan><tspan fill="#8A99B5"> [get_ports clk]</tspan></text>

      <text class="mono" x="2160" y="760" font-size="21"><tspan fill="#7DD3FC">create_clock</tspan><tspan fill="#C4B5FD"> -name </tspan><tspan fill="#E2E8F0">clk_slow</tspan><tspan fill="#C4B5FD"> -period </tspan><tspan fill="#FCD34D">8.000</tspan><tspan fill="#8A99B5"> [get_ports clk_slow]</tspan></text>

      <text class="mono" x="2160" y="820" font-size="21"><tspan fill="#7DD3FC">set_clock_groups</tspan><tspan fill="#C4B5FD"> -asynchronous </tspan><tspan fill="#8A99B5">-group {clk_core} -group {clk_slow}</tspan></text>
      <circle cx="2144" cy="814" r="7" fill="#34D399" filter="url(#cyanGlow)"/>
      <rect x="3010" y="792" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="819" font-size="18" fill="#D3F5EC">SDC-024 resolved</text>

      <text class="mono" x="2160" y="880" font-size="21"><tspan fill="#7DD3FC">set_propagated_clock</tspan><tspan fill="#8A99B5"> [get_clocks {clk_core clk_slow}]</tspan></text>
      <circle cx="2144" cy="874" r="7" fill="#34D399"/>
      <rect x="3010" y="852" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="879" font-size="18" fill="#D3F5EC">SDC-030 resolved</text>

      <text class="mono" x="2160" y="940" font-size="21"><tspan fill="#7DD3FC">set_input_delay</tspan><tspan fill="#C4B5FD"> -clock </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> -max </tspan><tspan fill="#FCD34D">0.4</tspan><tspan fill="#C4B5FD"> -min </tspan><tspan fill="#FCD34D">0.1</tspan></text>
      <circle cx="2144" cy="934" r="7" fill="#34D399" filter="url(#cyanGlow)"/>
      <rect x="3010" y="912" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="939" font-size="18" fill="#D3F5EC">SDC-028 resolved</text>

      <text class="mono" x="2160" y="1000" font-size="21"><tspan fill="#7DD3FC">set_output_delay</tspan><tspan fill="#C4B5FD"> -clock </tspan><tspan fill="#E2E8F0">clk_core</tspan><tspan fill="#C4B5FD"> -max </tspan><tspan fill="#FCD34D">0.35</tspan><tspan fill="#C4B5FD"> -min </tspan><tspan fill="#FCD34D">0.1</tspan></text>
      <circle cx="2144" cy="994" r="7" fill="#34D399"/>
      <rect x="3010" y="972" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="999" font-size="18" fill="#D3F5EC">SDC-029 resolved</text>

      <text class="mono" x="2160" y="1060" font-size="21"><tspan fill="#7DD3FC">set_case_analysis</tspan><tspan fill="#C4B5FD"> 0 </tspan><tspan fill="#8A99B5">[get_ports mode]</tspan><tspan fill="#5A7089">  # config mode is constant</tspan></text>
      <circle cx="2144" cy="1054" r="7" fill="#34D399" filter="url(#cyanGlow)"/>
      <rect x="3010" y="1032" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="1059" font-size="18" fill="#D3F5EC">SDC-049 resolved</text>

      <text class="mono" x="2160" y="1120" font-size="21" fill="#5A7089"># async CDC - two-flop synchronizer, no timing path</text>
      <text class="mono" x="2160" y="1180" font-size="21"><tspan fill="#7DD3FC">set_false_path</tspan><tspan fill="#C4B5FD"> -from </tspan><tspan fill="#8A99B5">[get_clocks clk_slow]</tspan></text>
      <circle cx="2144" cy="1174" r="7" fill="#34D399"/>
      <rect x="3010" y="1152" width="290" height="40" rx="20" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
      <text class="mono" x="3030" y="1179" font-size="18" fill="#D3F5EC">SDC-150 documented</text>
    </g>

    <line x1="2160" y1="1230" x2="3340" y2="1230" stroke="#34D399" stroke-opacity="0.20"/>
    <g class="mono" font-size="20">
      <text class="mono" x="2160" y="1290" font-size="20" fill="#5A7089">0 errors, 0 warnings</text>
      <text class="mono" x="2160" y="1340" font-size="20" fill="#5A7089">19 info-level suggestions remain</text>
      <text class="mono" x="2160" y="1390" font-size="20" fill="#5A7089">no open semantic finding</text>
    </g>
    <rect x="2160" y="1430" width="1180" height="100" rx="12" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.3"/>
    <text class="mono" x="2200" y="1472" font-size="20" fill="#D3F5EC">every finding names the rule that raised it</text>
    <text class="mono" x="2200" y="1508" font-size="20" fill="#7C90A8">and the fix is the same constraint, corrected</text>
  </g>

  <rect width="3840" height="2160" fill="url(#vig)" pointer-events="none"/>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.045" style="mix-blend-mode:overlay" pointer-events="none"/>
</svg>
