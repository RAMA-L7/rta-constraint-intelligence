[build-system]
# PEP 639: `license = "MIT"` (SPDX expression) + `license-files` require
# setuptools >= 77 to parse; older floors reject the string form with a
# `project.license` configuration error (verified: 68.1.2 fails, 77.0.1 builds).
# 77.0.0 was yanked from PyPI, so the floor is 77.0.1.
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rta-constraint-intelligence"
version = "1.5.7"
description = "Ṛta — deterministic SDC validation, generation, and pre-STA readiness review, with optional netlist-aware checking. No EDA tool required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["sdc", "vlsi", "timing", "constraints", "synopsys", "eda", "signoff", "sta", "constraint-intelligence"]
authors = [
    {name = "RAMA-L7"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]
dev = ["pre-commit>=3.0", "pytest>=7.0"]
all = ["streamlit>=1.35", "pre-commit>=3.0", "pytest>=7.0"]

[project.urls]
"Homepage" = "https://github.com/RAMA-L7/rta-constraint-intelligence"
"Repository" = "https://github.com/RAMA-L7/rta-constraint-intelligence.git"
"Bug Tracker" = "https://github.com/RAMA-L7/rta-constraint-intelligence/issues"

[project.scripts]
rta = "cli:main"

[tool.pytest.ini_options]
# Only collect test_*.py files. tests/run_comprehensive_test.py is a standalone
# CLI integration script (run via `python tests/run_comprehensive_test.py`), not
# a pytest module — importing it during collection would execute its module-level
# body and raise SystemExit.
python_files = ["test_*.py"]

[tool.setuptools]
py-modules = [
    "cli", "api_server", "checker", "generator", "corner_manager", "mmc",
    "tcl_resolver", "wildcard_analyzer", "constraint_diff",
    "clock_relations", "rules_registry", "reporter",
    "coverage", "custom_rules", "linter", "converter",
    "batch_runner", "design_context", "design_coverage",
    "constraint_interactions", "constraint_readiness",
    "readiness_diff", "policy_engine", "evidence",
    "finding_identity", "support_boundary", "sdc_preprocess",
    "rationale_lint", "async_reset_check", "dft_scan_check",
    "derate_methodology",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rta*", "legacy*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.sdc", "*.tcl", ".pre-commit-config.yaml"]

[tool.setuptools.data-files]
".pre-commit-hooks" = [".pre-commit-hooks/sdc-check.sh"]