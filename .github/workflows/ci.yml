name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: Run comprehensive CLI checks
        # Standalone integration script (all CLI commands, end-to-end).
        # Deliberately not a pytest module: pytest only collects test_*.py.
        run: |
          python tests/run_comprehensive_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Run CI gate exit-code verification
        # Standalone script proving the documented CI gate exit-code contract
        # (0 = pass, 1 = gate failed, 2 = invalid input, 3 = engine failure)
        # with real SDC fixtures and the exact commands the GitHub Action runs.
        run: |
          python tests/run_ci_gate_verification.py
        env:
          PYTHONIOENCODING: utf-8

  gate:
    # Real repository test of the Ṛta CI Quality Gate action
    # (.github/actions/rta-gate): runs the actual composite action against the
    # engineer_test_kit/14_baseline_gate fixture with a fresh baseline. The
    # action must exit 0 (PASS) here; the verification script below also
    # proves the FAIL (1) and invalid-input (2) paths with the same commands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate fixture baseline (current engine)
        run: |
          python cli.py check engineer_test_kit/14_baseline_gate/apb_uart.sdc \
            --netlist engineer_test_kit/14_baseline_gate/apb_uart_netlist.v \
            --top apb_uart_top \
            --save-baseline engineer_test_kit/14_baseline_gate/baseline.json

      - name: Run Ṛta CI gate (STRICT, real fixture)
        id: gate
        uses: ./.github/actions/rta-gate
        with:
          sdc: engineer_test_kit/14_baseline_gate/apb_uart.sdc
          netlist: engineer_test_kit/14_baseline_gate/apb_uart_netlist.v
          top: apb_uart_top
          baseline: engineer_test_kit/14_baseline_gate/baseline.json
          gate: STRICT
          install-source: local

      - name: Verify gate verdict
        run: |
          test "${{ steps.gate.outputs.exit-code }}" = "0"
          test "${{ steps.gate.outputs.gate-result }}" = "PASS"
          test -s rta-gate-result.json
          test -s rta-gate-junit.xml
          echo "gate exit-code=${{ steps.gate.outputs.exit-code }} result=${{ steps.gate.outputs.gate-result }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: |
          python -m py_compile cli.py
          python -m py_compile checker.py
          python -m py_compile generator.py
          python -m py_compile linter.py
          python -m py_compile converter.py
          python -m py_compile batch_runner.py
          python -m py_compile rules_registry.py

      - name: Verify imports work
        run: |
          python -c "from rules_registry import APP_VERSION; print(f'Version: {APP_VERSION}')"
          python -c "from checker import check_sdc; print('checker OK')"
          python -c "from linter import lint_sdc; print('linter OK')"
          python -c "from converter import sdc_to_json; print('converter OK')"
