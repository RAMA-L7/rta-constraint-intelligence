name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: |
          python -m py_compile cli.py
          python -m py_compile checker.py
          python -m py_compile generator.py
          python -m py_compile linter.py
          python -m py_compile converter.py
          python -m py_compile batch_runner.py
          python -m py_compile rules_registry.py

      - name: Verify imports work
        run: |
          python -c "from rules_registry import APP_VERSION; print(f'Version: {APP_VERSION}')"
          python -c "from checker import check_sdc; print('checker OK')"
          python -c "from linter import lint_sdc; print('linter OK')"
          python -c "from converter import sdc_to_json; print('converter OK')"
